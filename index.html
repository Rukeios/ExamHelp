<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SC-900 + Sec+ Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#CFE8F8;--surface:#FFFFFF;--sunk:#E3F1EE;--ink:#123B5B;--muted:#42677A;--line:#BED9D5;
  --sc:#2361A3;--sec:#198754;--gold:#198754;--violet:#2361A3;
  --ok:#1D7445;--bad:#B3261E;--okbg:#E2F1E8;--badbg:#F8E3E1;--scbg:#E3ECF6;--secbg:#E1F3E8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0A2942;--surface:#132B38;--sunk:#102C2D;--ink:#E4F2F1;--muted:#9AB9C1;--line:#294D53;
  --sc:#72A6E3;--sec:#5CC48A;--gold:#5CC48A;--violet:#72A6E3;
  --ok:#5CC48A;--bad:#F07C73;--okbg:#15301F;--badbg:#3A1C1A;--scbg:#15253A;--secbg:#15301F;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A2942;--surface:#132B38;--sunk:#102C2D;--ink:#E4F2F1;--muted:#9AB9C1;--line:#294D53;
  --sc:#72A6E3;--sec:#5CC48A;--gold:#5CC48A;--violet:#72A6E3;
  --ok:#5CC48A;--bad:#F07C73;--okbg:#15301F;--badbg:#3A1C1A;--scbg:#15253A;--secbg:#15301F;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);margin:0;padding-inline:16px;padding-block:20px 60px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,52px);text-transform:uppercase}
h2{font-size:30px}
h3{font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.eyebrow{font:500 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sc);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}

/* header */
header{display:flex;flex-direction:column;gap:14px}
.head-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.exams{display:flex;flex-wrap:wrap;gap:10px}
.exams .exam{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--line);min-width:150px}
.exams .exam b{font:700 24px/1 var(--display)}
.exams .exam.sc{border-left:4px solid var(--sc)} .exams .exam.sec{border-left:4px solid var(--sec)}
.sync{font:12px var(--mono);color:var(--muted)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font:600 17px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.rank-badge{align-self:flex-start;background:var(--ink);color:var(--bg);border-radius:999px;padding:5px 10px;font:500 12px var(--mono);letter-spacing:.04em}

/* strip */
.strip{display:grid;grid-template-columns:repeat(33,minmax(0,1fr));gap:3px}
@media (max-width:720px){.strip{grid-template-columns:repeat(11,minmax(0,1fr))}}
.cell{position:relative;height:40px;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--surface);border-radius:3px;font:600 13px var(--mono);color:var(--sec);padding:0;display:flex;align-items:center;justify-content:center}
.cell.sc{--c:var(--sc)} .cell.sec{--c:var(--sec)}
.cell.done{background:var(--c);color:var(--surface)}
.cell.exam::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell.review{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--sunk) 4px 6px)}
.cell.done.review{background-image:none}
.cell.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell.locked{opacity:1;cursor:not-allowed;background:var(--badbg);border-top-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}

/* lesson */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px}
.lesson{display:flex;flex-direction:column;gap:18px}
.lesson .tag{display:inline-block;padding:2px 8px;border-radius:3px;font:600 12px var(--mono);letter-spacing:.04em}
.tag.sc{background:var(--scbg);color:var(--sc)} .tag.sec{background:var(--secbg);color:var(--sec)}
.pts{display:flex;flex-direction:column;gap:12px;max-width:68ch;margin:0;padding:0;list-style:none}
.pts li{padding-left:14px;border-left:2px solid var(--line)}
.pts b{display:block;font-weight:600}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:0}
.terms div{background:var(--sunk);border-radius:5px;padding:8px 10px}
.terms dt{font:500 13px var(--mono)}
.terms dd{margin:0;font-size:13px;color:var(--muted)}
.trap{background:var(--badbg);border-radius:6px;padding:12px 14px;max-width:68ch}
.trap .eyebrow{color:var(--bad)}
.diagrams{display:flex;flex-direction:column;gap:14px}
.diagrams figure{margin:0;display:flex;flex-direction:column;gap:6px}
.diagrams img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.diagrams figcaption{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.modebtn{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left}
.modebtn small{font-weight:400;color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select,input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink)}

/* quiz */
.launch{display:grid;gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.runner{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.timer.low i{background:var(--bad)}
.qtext{font-size:19px;font-weight:500;line-height:1.45;max-width:65ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 14px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-top:2px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.why{border-left:3px solid var(--ok);padding:6px 12px;background:var(--sunk);border-radius:0 6px 6px 0}
.why.bad{border-left-color:var(--bad)}
textarea{width:100%;min-height:110px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical}
.grade{display:flex;flex-wrap:wrap;gap:8px}
.grade button.sugg{outline:2px solid var(--violet)}
.aifb{font-size:14px;border-left:3px solid var(--violet);padding:6px 12px;background:var(--sunk);border-radius:0 6px 6px 0}
.streak{font:600 13px var(--mono);color:var(--gold)}

.result-top{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.big{font:700 64px/0.9 var(--display)}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.misslist{display:flex;flex-direction:column;gap:10px}
.miss{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.miss .ans{font-size:14px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tile b{font:700 32px/1 var(--display)}
.chartbox{overflow-x:auto}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--sunk);border-radius:6px;position:relative;overflow:hidden}
.bar .track i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.bar .track::after{content:"";position:absolute;left:80%;top:0;bottom:0;border-left:1px dashed var(--muted)}
.chip{display:inline-block;font:500 11px var(--mono);padding:1px 6px;border-radius:3px}
.chip.weak{background:var(--badbg);color:var(--bad)} .chip.good{background:var(--okbg);color:var(--ok)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;text-align:right} th.num{text-align:right}
.mode-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.insight{white-space:pre-wrap;font-size:14px;line-height:1.6;max-width:70ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.game-card{border:1px solid var(--line);border-radius:7px;padding:14px;background:var(--surface)}
.game-card b{display:block;font:700 26px/1 var(--display);margin-bottom:5px}
.mission{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mission:last-child{border-bottom:0}.mission i{font-style:normal;color:var(--gold)}
.boss{border-left:4px solid var(--sec)}.boss.sc{border-left-color:var(--sc)}
.shake{animation:shake .35s linear}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pbq-list{display:flex;flex-direction:column;gap:9px}
.drag-item,.drop-slot{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px}
.drag-item{cursor:grab}.drop-slot{min-height:42px;background:var(--sunk)}
.drag-item:active{cursor:grabbing}.logline{width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);padding:7px 9px;font:12px var(--mono)}
.logline.flagged{border-color:var(--bad);background:var(--badbg)}
.story{border-left:4px solid var(--violet);padding:12px 14px;background:var(--sunk);border-radius:0 6px 6px 0;max-width:70ch}
@media (max-width:720px){nav.tabs{overflow-x:auto}nav.tabs button{flex:0 0 auto}}
@media (max-width:720px){.cols{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 60px}}
footer{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <div class="eyebrow">RJ · 33-day plan · two exams</div>
        <h1>SC-900 + Sec+ Sprint</h1>
        <span class="rank-badge" id="rank"></span>
      </div>
      <div class="exams" id="exams"></div>
    </div>
    <div class="row" style="justify-content:space-between">
      <label class="fld">Plan start date<input type="date" id="start"></label>
      <span class="sync" id="sync">Loading saved progress…</span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="plan" aria-selected="true">Plan</button>
      <button role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
      <button role="tab" data-tab="stats" aria-selected="false">Stats</button>
      <button role="tab" data-tab="game" aria-selected="false">Game</button>
      <button role="tab" data-tab="pbq" aria-selected="false">PBQs</button>
      <button role="tab" data-tab="campaign" aria-selected="false">Campaign</button>
      <button role="tab" data-tab="lab" aria-selected="false">Lab</button>
    </nav>
  </header>
  <main id="view"></main>
  <footer>
    <div>Study pairing: <a href="https://learn.microsoft.com/en-us/training/courses/sc-900t00" target="_blank" rel="noopener">Microsoft Learn SC-900 course</a> · <a href="https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/sc-900" target="_blank" rel="noopener">SC-900 skills measured</a> · <a href="https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/" target="_blank" rel="noopener">Professor Messer SY0-701 (free videos)</a> · <a href="https://www.comptia.org/certifications/security" target="_blank" rel="noopener">CompTIA Security+</a></div>
    <div>Keyboard in quizzes: 1–4 pick an answer, Enter goes to the next question.</div>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function(){
const DAYS = window.DAYS;
const BYDAY = Object.fromEntries(DAYS.map(d=>[d.d,d]));
const TRACK = {sc:"SC-900", sec:"Security+"};
const DOMS = {sc:["Concepts","Entra","Security solutions","Compliance"], sec:["1 General concepts","2 Threats & vulns","3 Architecture","4 Operations","5 Program mgmt"]};
const MODES = {think:{name:"Think",color:"var(--ink)",desc:"Untimed. See why after each answer."},
               blitz:{name:"Blitz",color:"var(--gold)",desc:"20 seconds each. Explanations at the end."},
               written:{name:"Written",color:"var(--violet)",desc:"No choices. Answer from memory, then grade."}};
const BLITZ_MS = 20000;

// ---------- question index ----------
const Q = {};
DAYS.forEach(day=>{ (day.q||[]).forEach((x,i)=>{ Q[day.d+"-"+i] = {k:day.d+"-"+i, d:day.d, track:day.track, dom:day.dom, q:x[0], o:x[1], a:x[2], why:x[3]}; }); });
const keysFor = days => Object.values(Q).filter(x=>days.includes(x.d)).map(x=>x.k);
const allTrackDays = t => DAYS.filter(d=>d.track===t && d.q).map(d=>d.d);
const RANKS=[["Recruit",0],["Specialist",250],["Sergeant",600],["Lieutenant",1100],["Captain",1800],["Cyber All-Star",2800]];
const ACHIEVEMENTS={clean:{name:"Clean Sweep",desc:"Score 100% on a 10+ question run"},night:{name:"Night Shift",desc:"Finish a quiz after midnight"},crypto:{name:"Crypto Sniper",desc:"Get five cryptography questions right"}};

// ---------- helpers ----------
function h(t,a,...c){const e=document.createElement(t);for(const[k,v]of Object.entries(a||{})){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}for(const x of c.flat(9)){if(x==null||x===false)continue;e.append(x.nodeType?x:document.createTextNode(String(x)));}return e;}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pct=(a,b)=>b?Math.round(100*a/b):0;
const fmtD=d=>d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const fmtDT=ts=>new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const secs=ms=>(ms/1000).toFixed(1)+"s";
function parseDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dayDate(n){const s=parseDate(state.start);s.setDate(s.getDate()+n-1);return s;}
function todayN(){return Math.floor((midnight(new Date())-parseDate(state.start))/864e5)+1;}
function unlockedDay(){const next=DAYS.find(d=>!state.done[d.d]);return next?next.d:33;}

// ---------- state + storage ----------
const LS="sprint.v2";
let state={start:"2026-09-24",done:{},xp:0,achievements:{},bosses:{},customQuestions:[],campaign:0};
let attempts=[];
let db=null, sample=null;
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null");}catch(e){return null;}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify({state,attempts:db?[]:attempts}));}catch(e){}}
const saved=lsGet(); if(saved){ if(saved.state) state=Object.assign(state,saved.state); if(!db && saved.attempts) attempts=saved.attempts; }
state.done=state.done||{}; state.achievements=state.achievements||{}; state.bosses=state.bosses||{}; state.customQuestions=state.customQuestions||[];
state.campaign=(state.campaign&&typeof state.campaign==="object"&&!("step" in state.campaign))?state.campaign:{};
state.customQuestions.forEach(addCustomQuestion);
let ui={tab:"plan",sel:null,quiz:{scope:"today",mode:"think",n:10},pbq:"firewall",generated:[]};
try{const u=JSON.parse(localStorage.getItem(LS+".ui")||"null"); if(u){ui.tab=u.tab||ui.tab; Object.assign(ui.quiz,u.quiz||{});}}catch(e){}
function saveUI(){try{localStorage.setItem(LS+".ui",JSON.stringify({tab:ui.tab,quiz:ui.quiz}));}catch(e){}}

let progWriting=Promise.resolve();
function saveProgress(){
  lsSet();
  if(db){ const body={start:state.start,done:state.done}; progWriting=progWriting.then(()=>db.doc("meta/progress").set(body)).catch(()=>{}); }
}
async function saveAttempt(rec){
  if(db){
    try{ await db.collection("attempts").add(rec); return; }
    catch(e){ if(e&&e.code==="quota_exceeded"){ setSync("Storage full: delete old attempts to save new ones"); } }
  }
  attempts.push(rec); attempts.sort((a,b)=>a.ts-b.ts); lsSet(); render();
}
function setSync(t){document.getElementById("sync").textContent=t;}
setSync("Saved in this browser only");

function addCustomQuestion(q){
  if(!q||!q.k||!Array.isArray(q.o)||q.o.length!==4||!Number.isInteger(q.a)) return;
  Q[q.k]=q;
}
function rank(){
  return RANKS.slice().reverse().find(([,need])=>state.xp>=need)||RANKS[0];
}
function award(name){
  if(state.achievements[name]) return;
  state.achievements[name]=Date.now();
  saveProgress();
}
function recordGameProgress(rec){
  const correct=rec.items.reduce((n,[,ok])=>n+(ok===1?1:0),0);
  const bonus=rec.mode==="blitz"?correct*5:rec.mode==="written"?correct*8:0;
  state.xp+=(correct*10)+bonus;
  if(rec.n>=10&&rec.pct===100) award("clean");
  if(new Date(rec.ts).getHours()<5) award("night");
  const crypto=rec.items.filter(([k,ok])=>ok===1&&/crypt|public key|private key|hash/i.test(Q[k]&&Q[k].q)).length;
  if(crypto>=5) award("crypto");
  saveProgress();
}
function missionData(){
  const today=midnight(new Date()).getTime();
  const todayItems=attempts.filter(a=>midnight(new Date(a.ts)).getTime()===today).flatMap(a=>a.items||[]);
  const correct=todayItems.filter(([,ok])=>ok===1).length;
  const blitz=attempts.filter(a=>midnight(new Date(a.ts)).getTime()===today&&a.mode==="blitz").flatMap(a=>a.items||[]);
  const fast=blitz.filter(([,ok,ms])=>ok===1&&ms<8000).length;
  const outcomes={};
  attempts.forEach(a=>(a.items||[]).forEach(([k,ok])=>{const r=outcomes[k]||(outcomes[k]=[]);r.push(ok);}));
  const cleared=Object.values(outcomes).filter(r=>r.includes(0)&&r[r.length-1]===1).length;
  return [
    {text:"Answer 5 questions today",now:todayItems.length,goal:5},
    {text:"Get 3 correct in Blitz under 8 seconds",now:fast,goal:3},
    {text:"Clear 5 weak spots",now:cleared,goal:5}
  ];
}

// connect capabilities
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("db").then(d=>{
    if(!d) return;
    db=d; setSync("Synced to your account");
    const local=attempts.slice();
    let first=true;

  1:{"id":"m1","title":"Day One: Keys to the Kingdom","track":"sc","domain":"Entra","brief":"Your manager hands you the Microsoft 365 admin portal. You find 14 accounts with Global Administrator, MFA isn't required for anyone, and the help desk resets about 40 passwords a week by hand.","steps":[["Fourteen Global Admins is a problem. What's the best fix?",["Give each admin the narrowest built-in role they need, and use PIM so admin roles activate just in time","Keep all 14 but make them change passwords monthly","Delete every admin account and share one master login","Move the admins into a Microsoft 365 group"],0,"Least privilege plus PIM: fewer standing admins, elevation only when needed, time-limited and audited."],["You need MFA for everyone this week, and there's no budget for premium licenses. What do you turn on?",["Security defaults","Conditional Access policies","Entra ID Protection risk policies","Access reviews"],0,"Security defaults are free and require MFA for everyone. Conditional Access needs Entra ID P1."],["What cuts the 40 weekly password-reset tickets?",["Self-service password reset","A longer password expiry period","Defender for Identity","A custom banned password list"],0,"SSPR lets users verify themselves and reset their own password."],["Staff keep choosing passwords like 'LeonRiver2026'. What blocks that?",["A custom banned password list","Smart lockout","Security defaults","Sensitivity labels"],0,"The custom banned list blocks org-specific words on top of Microsoft's global list."]],"debrief":"You shrank the admin attack surface, got MFA everywhere, and gave the help desk its week back. Identity is the new perimeter, and you just built the wall."},
  2:{"id":"m2","title":"The Blueprint","track":"sc","domain":"Concepts","brief":"Leadership read the phrase 'Zero Trust' in a vendor pitch and wants to know what it actually means for the utility. You're asked to explain the model and where to start.","steps":[["Which statement captures Zero Trust?",["Never trust by default; verify every request explicitly, use least privilege, and assume breach","Trust anything already inside the corporate network","Trust any device with antivirus installed","Trust users after they sign in once"],0,"Zero Trust kills implicit trust: verify explicitly, least privilege, assume breach."],["Which is NOT one of the three Zero Trust principles?",["Trust traffic on the internal network","Verify explicitly","Use least-privilege access","Assume breach"],0,"'Inside equals trusted' is exactly the assumption Zero Trust removes."],["The team wants layered protection so one failure doesn't expose everything. That approach is:",["Defense in depth","Shared responsibility","A honeypot","Single sign-on"],0,"Multiple independent layers around the same asset is defense in depth."],["Where does Zero Trust say to start verifying?",["With identity, since identity is the primary control plane","With the office door locks","With the coffee machine firmware","Nowhere; buy one product and you're done"],0,"Identity is the new perimeter and the main place to verify explicitly."]],"debrief":"You gave leadership a plain-English model and a starting point: identity first, verify everything, assume the attacker is already in."},
  3:{"id":"m3","title":"Locking the Vault","track":"sc","domain":"Concepts","brief":"An auditor asks how the utility protects customer data both where it's stored and while it moves between systems, and how it stores passwords.","steps":[["Customer records sitting in a database are 'data at rest'. How should they be protected?",["Encryption at rest","Left in plaintext behind a firewall","Hashed so nobody, including staff, can ever read them","Compressed"],0,"At-rest data should be encrypted so a stolen disk reveals nothing."],["Data moving between the billing app and the database is 'data in transit'. Protect it with:",["Encryption in transit (TLS)","A retention label","A honeytoken","A longer password"],0,"TLS encrypts data as it crosses the network."],["How should user passwords be stored?",["Hashed (and salted), never reversibly encrypted","Encrypted with a shared key the admins hold","In plaintext for help desk convenience","Only in the user's browser"],0,"Passwords are hashed and salted; hashing is one-way and can't be reversed."],["The auditor asks the difference between hashing and encryption. Correct answer:",["Encryption is reversible with a key; hashing is one-way and can't be undone","They are the same thing","Hashing is reversible; encryption is not","Both require a public and private key"],0,"Encryption is two-way with a key; hashing is a one-way fingerprint."]],"debrief":"You showed the auditor encryption at rest and in transit, plus salted password hashing. The report came back clean."},
  4:{"id":"m4","title":"The Travel Alert","track":"sc","domain":"Entra","brief":"A manager's account signs in from Killeen at 9 AM and from another country 20 minutes later. You want rules that react to signals like this automatically.","steps":[["What kind of policy reacts to signals like location, device, and risk to allow, block, or require MFA?",["Conditional Access","Security defaults","Self-service password reset","A retention policy"],0,"Conditional Access takes signals and makes an access decision."],["Which feature actually flagged that impossible-travel sign-in as risky?",["Microsoft Entra ID Protection","Microsoft Purview DLP","Azure Firewall","Compliance Manager"],0,"ID Protection scores sign-in risk, including atypical travel."],["You want risky sign-ins to be forced through MFA automatically. How?",["Feed ID Protection's risk level into a Conditional Access policy","Email each user when they look risky","Disable MFA to reduce friction","Turn off the account permanently"],0,"Risk-based Conditional Access requires MFA (or blocks) when risk is detected."],["A contractor should only reach the billing app from a compliant, managed device. That device check is:",["A Conditional Access signal","A honeypot","A banned password","Tokenization"],0,"Device compliance is one of the signals Conditional Access evaluates."]],"debrief":"Risky sign-ins now hit an MFA wall on their own, and sensitive apps require a managed device. The manager's account was safe."},
  5:{"id":"m5","title":"Just-in-Time","track":"sc","domain":"Entra","brief":"Two engineers need occasional admin rights to fix Azure resources, but you don't want them holding standing Global Admin all day, every day.","steps":[["What gives them admin only when needed, for a limited time, with approval and MFA, all audited?",["Privileged Identity Management (PIM)","Security defaults","A shared admin account","Entra Connect"],0,"PIM provides just-in-time, time-bound, approved admin access."],["Between fixes, what role should their everyday accounts hold?",["A standard, non-privileged role","Global Administrator at all times","Two Global Admin accounts each","Guest"],0,"Standing privilege is the risk; keep everyday accounts non-privileged."],["Quarterly, someone should confirm these engineers still need their admin eligibility. Use:",["Access reviews","DLP","Azure Bastion","A honeynet"],0,"Access reviews re-certify who still needs access."],["Assigning User Administrator instead of Global Administrator follows which principle?",["Least privilege","Assume breach","Non-repudiation","Federation"],0,"Grant the narrowest role that does the job."]],"debrief":"Admin power is now checked out for two hours at a time with approval and logging. No more all-day god mode."},
  6:{"id":"m6","title":"The Guest List","track":"sc","domain":"Entra","brief":"A review of the tenant shows 60 guest accounts from past projects, many unused for over a year. Partners still need some access.","steps":[["Partners signing in with their own company credentials as guests is enabled by:",["Microsoft Entra External ID (B2B collaboration)","Managed identities","Security defaults","Hybrid join"],0,"B2B lets external users in as guests with their own identity."],["What's the cleanest way to remove guests who no longer need access?",["An access review targeting guest accounts","Delete the whole tenant and rebuild","Change every guest's password","Ignore them; guests are harmless"],0,"Access reviews can automatically remove guests who are no longer needed."],["A vendor's app needs to read an Azure resource without any stored password. Best identity?",["A managed identity","A shared guest login","A security question","A service account with the password in code"],0,"Managed identities let Azure handle the credential, with nothing in code."],["Bundling the groups, apps, and sites a partner needs, with approval and a 90-day expiry, uses:",["An entitlement management access package","Security defaults","Smart lockout","A retention label"],0,"Access packages grant bundled access with approval and expiration."]],"debrief":"Stale guests are gone, active partners kept clean access, and new partner access now expires on its own."},
  7:{"id":"m7","title":"Shadow Apps Everywhere","track":"sc","domain":"Security solutions","brief":"Leadership suspects staff use random cloud apps for file sharing. They also want one place to see alerts from email, laptops, and the cloud.","steps":[["Which tool discovers which unsanctioned cloud apps employees use?",["Microsoft Defender for Cloud Apps","Microsoft Defender for Identity","Azure DDoS Protection","Compliance Manager"],0,"Defender for Cloud Apps is the CASB that discovers shadow IT."],["You want one cloud-native SIEM that collects logs from everything and auto-responds. Use:",["Microsoft Sentinel","Microsoft Purview","Azure Key Vault","Security defaults"],0,"Sentinel is SIEM plus SOAR."],["Several related alerts across email and devices should be grouped into one:",["Incident","Workbook","Access package","Retention label"],0,"Defender XDR correlates related alerts into a single incident."],["Which Defender product specifically protects on-prem Active Directory from attacks?",["Defender for Identity","Defender for Endpoint","Defender for Office 365","Defender for Cloud Apps"],0,"Defender for Identity watches on-prem AD from sensors on domain controllers."]],"debrief":"Shadow IT is mapped, and one dashboard now shows the whole environment. You're the person people ask now."},
  8:{"id":"m8","title":"One Pane of Glass","track":"sc","domain":"Security solutions","brief":"Analysts are drowning in repetitive alerts. You want Sentinel to visualize trends and take some actions automatically.","steps":[["In Sentinel, an automated response built on Logic Apps is a:",["Playbook","Workbook","Sensitivity label","Access review"],0,"Playbooks automate response; workbooks visualize."],["A dashboard that visualizes security data in Sentinel is a:",["Workbook","Playbook","Honeynet","Retention label"],0,"Workbooks are Sentinel's dashboards."],["Analysts want to search proactively for hidden threats before any alert fires. This is:",["Threat hunting","Automated remediation","Compliance scoring","Patching"],0,"Hunting is proactive searching, often with KQL."],["An analyst wants AI to summarize a messy incident and draft KQL. Use:",["Microsoft Security Copilot","Compliance Manager","Azure Bastion","A network security group"],0,"Security Copilot is the generative-AI assistant for security work."]],"debrief":"Routine alerts now trigger playbooks, dashboards show the trends, and Copilot drafts the tedious queries."},
  9:{"id":"m9","title":"Safe Links","track":"sc","domain":"Security solutions","brief":"Employees keep receiving phishing emails with malicious links and attachments, and a few keep clicking.","steps":[["Which product provides Safe Links and Safe Attachments for email?",["Microsoft Defender for Office 365","Microsoft Defender for Endpoint","Azure Firewall","Entra Verified ID"],0,"Defender for Office 365 protects email and collaboration."],["Which product protects the laptops themselves if someone runs a malicious attachment?",["Defender for Endpoint","Defender for Office 365","Defender for Cloud Apps","Compliance Manager"],0,"Defender for Endpoint protects devices."],["To cut clicks over time, you also run:",["A security awareness phishing simulation campaign","A DDoS test against staff","A shared password rollout","A honeynet on every desk"],0,"Simulated phishing plus training reduces real clicks."],["A finance clerk gets a 'CEO' email demanding an urgent wire transfer. The safe response is:",["Verify out-of-band by calling the CEO at a known number","Reply to the email to confirm","Wire it quietly as asked","Forward it company-wide first"],0,"Out-of-band verification defeats business email compromise."]],"debrief":"Malicious links get rewritten and detonated safely, endpoints are covered, and click rates are dropping with training."},
  10:{"id":"m10","title":"Raising the Score","track":"sc","domain":"Security solutions","brief":"The board wants a single number that shows how secure the Azure environment is and what to fix next.","steps":[["Which tool gives a Secure Score with prioritized recommendations for cloud configuration?",["Microsoft Defender for Cloud","Microsoft Sentinel","Service Trust Portal","Access reviews"],0,"Defender for Cloud's posture management provides Secure Score."],["Don't confuse it with the compliance score. That one comes from:",["Microsoft Purview Compliance Manager","Defender for Cloud","Azure Bastion","Key Vault"],0,"Compliance Manager tracks regulatory progress with a compliance score."],["Admins need to RDP to VMs without giving them public IPs. Use:",["Azure Bastion","A network security group only","Azure DDoS Protection","A honeyfile"],0,"Bastion brokers RDP/SSH over TLS with no public IP on the VM."],["Where should the apps store secrets and certificates?",["Azure Key Vault","In source code","On a shared drive","In the Secure Score dashboard"],0,"Key Vault safely stores secrets, keys, and certificates."]],"debrief":"The board got its number, and Secure Score gave you a ranked to-do list. Each fix nudges it up."},
  11:{"id":"m11","title":"The Leaky Spreadsheet","track":"sc","domain":"Compliance","brief":"An employee accidentally emailed a spreadsheet of customer names and Social Security numbers to an outside contractor. Legal wants this to never happen again.","steps":[["Which tool detects SSNs in outgoing email and blocks or warns before sending?",["Microsoft Purview Data Loss Prevention","Azure Bastion","Microsoft Sentinel","Entra Connect"],0,"DLP spots sensitive info types like SSNs and blocks or warns."],["Legal wants customer files marked 'Confidential' and encrypted so protection follows the file. Use:",["Sensitivity labels","Retention labels","Network security groups","Secure Score"],0,"Sensitivity labels classify and encrypt, and protection travels with the file."],["Legal must find and preserve every copy of that spreadsheet in mailboxes for a possible lawsuit. Use:",["eDiscovery with a legal hold","Compliance Manager","Defender for Endpoint","Access reviews"],0,"eDiscovery searches, holds, and exports content for legal matters."],["Who sent the file, and when? Look in:",["The Purview audit log","The Service Trust Portal","Azure Key Vault","Secure Score"],0,"Audit records user activity, including email actions."]],"debrief":"DLP now catches SSNs before they leave, customer files carry a Confidential label, and legal has what it needs."},
  12:{"id":"m12","title":"Seven Years","track":"sc","domain":"Compliance","brief":"Regulations require the utility to keep certain records for seven years, then dispose of them, and to prevent tampering with declared records.","steps":[["A rule that keeps all email for 7 years then deletes it, applied across all mailboxes, is a:",["Retention policy","Sensitivity label","DLP policy","Access review"],0,"Retention policies apply keep/delete rules broadly to locations."],["A keep/delete rule applied to a single important document is a:",["Retention label","Retention policy","Sensitivity label","Playbook"],0,"Retention labels apply to individual items; policies apply to locations."],["Declaring an item a record so it can't be edited or deleted is part of:",["Records management","Insider risk management","Secure Score","Federation"],0,"Records management locks declared records against change."],["Where do you review Microsoft's own audit reports (SOC, ISO) for its cloud?",["Service Trust Portal","Compliance Manager","Defender for Cloud","Sentinel"],0,"The Service Trust Portal hosts Microsoft's compliance documentation."]],"debrief":"Retention runs automatically, key records are locked, and you can point auditors to Microsoft's own attestations."},
  13:{"id":"m13","title":"After the Audit","track":"sec","domain":"1 General concepts","brief":"An external audit lists gaps. Your manager asks you to classify each proposed fix by control type so the report is consistent.","steps":[["A new door lock to stop unauthorized entry is which control type?",["Preventive","Detective","Corrective","Deterrent"],0,"A lock stops entry, so it's preventive."],["A camera that helps you review a break-in afterward is which type?",["Detective","Preventive","Deterrent","Directive"],0,"It finds and records events, so it's detective."],["A legacy server can't be patched, so you isolate it on its own VLAN. That substitute is a:",["Compensating control","Directive control","Deterrent control","Preventive patch"],0,"A compensating control substitutes when the ideal control can't be applied."],["An 'authorized personnel only' policy sign is which type?",["Directive","Detective","Corrective","Physical only"],0,"Directive controls instruct people what to do."]],"debrief":"Every gap now maps cleanly to a control category and type. The auditor liked the clarity."},
  14:{"id":"m14","title":"The Expired Certificate","track":"sec","domain":"1 General concepts","brief":"The customer payment portal throws certificate warnings in browsers. You dig into the utility's PKI.","steps":[["What issues and signs the certificates that browsers trust?",["A certificate authority (CA)","A network security group","A honeypot","An IPS"],0,"The CA signs certificates that establish trust."],["To get a new certificate, you send the CA a:",["Certificate signing request (CSR)","CRL","Backout plan","Salt"],0,"The CSR is the request submitted to the CA."],["To check in real time whether a certificate is revoked, use:",["OCSP","A downloaded CRL only","A CSR","Key escrow"],0,"OCSP answers revocation status live, one certificate at a time."],["One certificate should cover mail.leon.gov, vpn.leon.gov, and pay.leon.gov under one domain. Use a:",["Wildcard certificate","Self-signed certificate","Revoked certificate","Symmetric key"],0,"A wildcard cert (*.leon.gov) covers all subdomains."]],"debrief":"The portal's certificate is renewed and valid, revocation checking is live, and the warnings are gone."},
  15:{"id":"m15","title":"Sign Here","track":"sec","domain":"1 General concepts","brief":"The utility wants to email signed work orders that recipients can trust weren't altered, and to receive confidential documents securely.","steps":[["To send a document only Bob can read, encrypt it with:",["Bob's public key","Bob's private key","Your private key","A shared password in the email"],0,"Anyone can lock with Bob's public key; only his private key unlocks it."],["To let recipients verify a work order came from you and wasn't changed, you:",["Sign it with your private key","Encrypt it with the recipient's private key","Hash it and publish the hash only","Send it over plain HTTP"],0,"Signing with your private key gives integrity, authentication, and non-repudiation."],["Recipients verify that signature using:",["Your public key","Your private key","Their own private key","A shared symmetric key"],0,"A signature made with your private key is verified with your public key."],["'You can't later deny you signed it' is the property called:",["Non-repudiation","Availability","Confidentiality","Obfuscation"],0,"Non-repudiation ties the action to you undeniably."]],"debrief":"Work orders are signed and verifiable, and inbound confidential files are encrypted to your public key. Sign with private, encrypt with the recipient's public."},
  16:{"id":"m16","title":"Change Friday","track":"sec","domain":"1 General concepts","brief":"A rushed firewall change last Friday took billing offline all weekend. Leadership wants a real change process.","steps":[["What should have been prepared so the change could be undone quickly?",["A backout plan","A honeypot","A longer maintenance window only","A new CA"],0,"The backout plan restores the previous working state fast."],["Who should review and approve significant changes before they happen?",["A change advisory board","Whoever is nearest the keyboard","The end users after the fact","No one, to move fast"],0,"A change advisory board reviews impact and approves."],["When should risky changes be scheduled?",["During an approved maintenance window","Friday at 5 PM before a long weekend","Randomly during peak hours","Whenever, without notice"],0,"Maintenance windows limit blast radius and set expectations."],["After the change, what must be updated?",["Documentation, diagrams, and version control","Nothing, if it works","Only the person's memory","The marketing site"],0,"Change management ends with updated documentation and records."]],"debrief":"Changes now get impact analysis, approval, a window, and a backout plan. No more weekend outages from a rushed edit."},
  17:{"id":"m17","title":"The Invoice That Wasn't","track":"sec","domain":"2 Threats & vulns","brief":"Accounts payable forwards an email that looks like it's from the general manager, asking to wire $48,000 to a 'new vendor account' today and keep it quiet. The sender domain is one letter off from the real one.","steps":[["What kind of attack is this?",["Business email compromise using a look-alike domain","A watering hole attack","A worm outbreak","A DDoS attack"],0,"Impersonating an executive to redirect payment is BEC; the one-letter domain is typosquatting."],["What should AP do before any money moves?",["Verify out-of-band by calling the GM at a known number","Reply to the email asking if it's real","Wire half as a test","Forward it company-wide first"],0,"Out-of-band verification defeats BEC; replying goes to the attacker."],["Which email controls help receivers reject mail spoofing YOUR real domain?",["SPF, DKIM, and DMARC together","Full-disk encryption","An NSG rule","Tokenization"],0,"SPF says who can send, DKIM signs, DMARC enforces. Look-alike domains also need gateway and awareness controls."],["The 'today' and 'keep it quiet' pressure are examples of:",["Social engineering urgency and secrecy tactics","Non-repudiation","Defense in depth","Data sovereignty"],0,"Urgency and secrecy push people to skip verification."]],"debrief":"The money stayed put. You added out-of-band verification to the payment procedure and scheduled phishing training for finance."},
  18:{"id":"m18","title":"Help Desk Under Siege","track":"sec","domain":"2 Threats & vulns","brief":"Someone calls the help desk claiming to be a field engineer locked out before a big repair, pressuring the tech to reset an admin password immediately.","steps":[["This phone-based manipulation is:",["Vishing (voice phishing)","Smishing","A watering hole","A worm"],0,"Voice phishing is vishing."],["What should the tech do before resetting anything?",["Verify the caller's identity through the established process","Reset it immediately to avoid delaying the repair","Ask the caller for their password to confirm","Post the new password in the team chat"],0,"Identity verification defeats pretexting; urgency is the red flag."],["The invented 'field engineer locked out' story is called:",["A pretext","A honeytoken","A CSR","A baseline"],0,"Pretexting is the fabricated scenario used to gain trust."],["What long-term control reduces help-desk social engineering?",["Security awareness training and a strict identity-verification procedure","Removing the phone line","Giving everyone admin rights","Disabling MFA"],0,"Training plus a firm verification process is the defense."]],"debrief":"The tech verified and refused. You turned the near-miss into a training example and tightened the reset procedure."},
  19:{"id":"m19","title":"Spray and Pray","track":"sec","domain":"2 Threats & vulns","brief":"Sign-in logs show hundreds of accounts each with one or two failed logins, all using the password 'Spring2026!'.","steps":[["What attack is this?",["Password spraying","Brute force against one account","A rainbow table attack","A logic bomb"],0,"One common password tried across many accounts is spraying, designed to stay under lockout limits."],["Which control most directly limits both spraying and brute force?",["MFA on all accounts","Longer session timeouts","A faster CPU","More log storage"],0,"Even a guessed password fails without the second factor."],["Contrast: hundreds of failed logins on a single admin account would be:",["Brute force","Password spraying","Phishing","An evil twin"],0,"Many guesses against one account is brute force."],["Which log indicator suggests a compromised account after a spray?",["A successful login from an unusual location right after failures","A user changing their theme","A scheduled backup running","A printer going offline"],0,"Impossible travel or an odd successful login is the tell."]],"debrief":"MFA blunted the spray, and you flagged two accounts for reset after suspicious success. Spraying beaten by a second factor."},
  20:{"id":"m20","title":"The Injected Form","track":"sec","domain":"2 Threats & vulns","brief":"The customer portal's login box receives the input:  ' OR 1=1 --  and the web logs show odd database errors.","steps":[["What attack is this?",["SQL injection","Cross-site scripting","Buffer overflow","Directory traversal"],0,"Quote-plus-always-true logic aimed at the database is SQLi."],["What's the best fix?",["Parameterized queries and input validation","A longer admin password","Full-disk encryption","Renaming the database"],0,"Parameterized queries stop user input from being treated as SQL."],["Another log shows /search?q=<script>alert(1)<\/script>. That's:",["Cross-site scripting (XSS)","SQL injection","CSRF","A race condition"],0,"Injected script tags that run in the browser are XSS."],["A quick protective layer for the public web app while devs fix the code is a:",["Web Application Firewall (WAF)","A network security group only","Azure Bastion","A honeynet"],0,"A WAF filters web attacks like SQLi and XSS."]],"debrief":"The dev team moved to parameterized queries, and a WAF now shields the portal. Injection attempts bounce off."},
  21:{"id":"m21","title":"Patient Zero","track":"sec","domain":"2 Threats & vulns","brief":"One laptop got infected from a USB drive, and within an hour three more machines on the same subnet show the same malware, with no user action on those three.","steps":[["Malware spreading to other machines by itself, with no user action, is a:",["Worm","Virus","Trojan","Logic bomb"],0,"Self-propagation across the network is the worm's signature."],["The USB drive was the:",["Attack vector","Threat actor","Payload only","Honeytoken"],0,"The removable media was the path in, the vector."],["What limits the spread to just that subnet next time?",["Network segmentation","A longer password policy","Key escrow","Steganography"],0,"Segmentation stops lateral movement between zones."],["What should you do with the infected machines right now?",["Isolate them from the network","Reimage instantly without capturing anything","Leave them online to watch","Email users to unplug later"],0,"Contain first to stop spread and preserve evidence."]],"debrief":"You isolated the four hosts, segmented the network, and blocked USB autorun. The worm stopped at four."},
  22:{"id":"m22","title":"The Plant Floor","track":"sec","domain":"3 Architecture","brief":"You tour the treatment plant. The SCADA system running the pumps is on Windows 7, the vendor won't support upgrades, and it sits on the same flat network as office PCs and guest Wi-Fi.","steps":[["What's the biggest architecture problem?",["The control system shares a flat network with office and guest devices","The plant uses too much power","The screens are too small","Office PCs run Windows 11"],0,"A flat network lets an office infection reach the control system."],["You can't patch or upgrade the SCADA host. Best compensating control?",["Segment it on an isolated network with strict firewall rules, or air-gap it","Install several consumer antivirus tools","Expose it to the internet for vendor support","Turn it off at night"],0,"When you can't patch, isolate. Segmentation is the ICS compensating control."],["For the water plant, which part of CIA usually matters most?",["Availability","Confidentiality","Non-repudiation","Obfuscation"],0,"If the pumps stop, the town loses water; ICS puts availability first."],["The vendor needs remote maintenance access. Safest design?",["A hardened jump server with MFA, approved windows, and full logging","An open RDP port on the SCADA host","Emailed admin password","SCADA on guest Wi-Fi"],0,"A jump server gives one controlled, monitored path in."]],"debrief":"The plant lives on its own segment now, and vendor access runs through a logged jump server. The board noticed."},
  23:{"id":"m23","title":"Drawing the Perimeter","track":"sec","domain":"3 Architecture","brief":"The public web server currently sits on the internal LAN next to the databases. You're asked to redesign the network edge and add monitoring that can actually stop attacks.","steps":[["Where should the public web server live?",["In a screened subnet (DMZ)","On the internal LAN by the databases","On an air-gapped segment","On guest Wi-Fi"],0,"Public-facing servers belong in a DMZ, isolated from the internal network."],["You must block malicious traffic in real time, not just alert. Deploy:",["An IPS inline","An IDS on a tap","A NetFlow collector","A dashboard"],0,"Only an inline IPS can stop traffic; an IDS only detects and alerts."],["Admins should reach production only through one hardened, monitored host. That's a:",["Jump server","Load balancer","Forward proxy","Honeypot"],0,"A jump server is the controlled admin gateway."],["The firewall fails, and the utility values security over uptime. Configure it to:",["Fail closed","Fail open","Monitor mode","Bypass"],0,"Fail-closed blocks traffic when the device fails."]],"debrief":"The web server sits in a DMZ behind an IPS, admins go through a jump server, and the firewall fails closed. Clean perimeter."},
  24:{"id":"m24","title":"Hurricane Season","track":"sec","domain":"3 Architecture","brief":"The board asks: if a storm takes out the main office for a week, how fast can billing return and how much data could be lost? Backups currently run nightly to a server in the same building.","steps":[["'Billing must be back within 8 hours' defines the:",["RTO","RPO","MTBF","SLA"],0,"Recovery time objective is the maximum acceptable downtime."],["'We can lose at most 1 hour of payments' defines the:",["RPO","RTO","MTTR","ALE"],0,"Recovery point objective is the maximum acceptable data loss in time."],["What's wrong with the current backup setup?",["Backups sit in the same building, so one disaster destroys both","Nightly backups are too frequent","Backups should never be encrypted","Nothing is wrong"],0,"Keep at least one copy offsite or in the cloud, geographically separated."],["A recovery site with hardware ready but data restored on demand, back in hours, is a:",["Warm site","Cold site","Hot site","Honeynet"],0,"Warm site: equipment ready, data restored when needed."]],"debrief":"Hourly offsite cloud backups, a warm site agreement, and a tabletop exercise on the calendar. The board approved the budget."},
  25:{"id":"m25","title":"Beaconing at 2 AM","track":"sec","domain":"4 Operations","brief":"The SIEM fires: a billing workstation has contacted an unfamiliar external IP every 60 seconds since 2 AM. EDR shows an unknown process launched from a user's Downloads folder.","steps":[["What's your first action?",["Isolate the workstation from the network using EDR","Reimage it immediately","Email the user and wait","Ignore it until business hours"],0,"Contain first; isolation stops spread and C2 traffic while preserving evidence."],["Following order of volatility, what do you capture first?",["Memory (RAM)","A full disk image","Last month's backups","The printed manual"],0,"RAM disappears at power-off, so capture it first."],["Which is the correct incident-response order?",["Containment, then eradication, then recovery","Eradication, then containment, then recovery","Recovery, then containment, then eradication","Lessons learned, then detection, then containment"],0,"Stop the spread, remove the threat, then restore."],["After the machine is rebuilt and returned, the final phase is:",["Lessons learned","Detection","Preparation","Containment"],0,"Recovery, then lessons learned: what happened and what to change."]],"debrief":"One infected workstation, zero spread. Your lessons-learned report recommends an application allow list for billing."},
  26:{"id":"m26","title":"Chain of Custody","track":"sec","domain":"4 Operations","brief":"The beaconing laptop may be evidence in a possible prosecution. Legal asks you to handle it so the evidence holds up.","steps":[["Documenting every person who handled the drive, with time and purpose, preserves:",["Chain of custody","The RPO","The baseline","Non-repudiation only"],0,"Chain of custody keeps evidence trustworthy and admissible."],["How should the disk be acquired for analysis?",["A bit-for-bit image that is then hashed","Copy a few important files","Boot the original and browse it","Delete temp files first to clean it"],0,"A hashed forensic image proves the copy matches and is unaltered."],["Legal orders that all related data be preserved for the case. This is a:",["Legal hold","Retention deletion","Root cause analysis","Backout plan"],0,"Legal hold prevents deletion of relevant data."],["Why capture RAM before powering off?",["It's the most volatile evidence and is lost at shutdown","It's the least important","Disk data disappears first","Backups are more volatile"],0,"Order of volatility: memory first, backups last."]],"debrief":"You imaged and hashed the drive, logged every handoff, and placed a legal hold. The evidence will stand up."},
  27:{"id":"m27","title":"Scanner Says Critical","track":"sec","domain":"4 Operations","brief":"The monthly vulnerability scan returns 212 findings. Three are critical, including one on the public payment portal. Your team can fix about 20 this week.","steps":[["How do you decide what to fix first?",["By severity plus exposure and business impact, starting with the internet-facing portal","Alphabetically by server name","Whatever is easiest","Oldest finding first"],0,"Prioritize by severity and real exposure; an internet-facing critical wins."],["One 'critical' is for software not installed on that server. This is a:",["False positive","False negative","True positive","Zero-day"],0,"Reported but not real is a false positive; verify before spending time."],["The portal fix needs a vendor patch due next month. Until then you:",["Apply a compensating control like a WAF rule and document a risk exception","Ignore it","Take the portal down for a month silently","Mark it fixed in the report"],0,"Compensating controls reduce risk until the real fix lands, with the exception documented."],["After patching, how do you confirm it worked?",["Rescan and validate","Assume it worked","Ask the vendor","Delete the old report"],0,"Validation means rescanning to prove the flaw is gone."]],"debrief":"Criticals closed in six days with a WAF covering the gap, and your report's trend line finally sold leadership on patch cadence."},
  28:{"id":"m28","title":"Bring Your Own Risk","track":"sec","domain":"4 Operations","brief":"Field staff want to use personal phones for work email, and the plant's Wi-Fi still runs old security. You set mobile and wireless policy.","steps":[["What lets you manage and remotely wipe work data on devices?",["Mobile device management (MDM)","A honeypot","NetFlow","A CSR"],0,"MDM manages and can wipe devices."],["Staff use their own phones. That ownership model is:",["BYOD","COPE","CYOD","VDI"],0,"Bring your own device is employee-owned."],["You upgrade the wireless. Which is the current, strongest standard?",["WPA3","WPA2 only","WEP","Open with a hidden SSID"],0,"WPA3 (with SAE) is the current standard; WEP is broken."],["For plant staff on shared devices, the company buys phones but allows personal use. That's:",["COPE","BYOD","CYOD","MAC"],0,"Company-owned, personally enabled."]],"debrief":"Work data is contained by MDM and remotely wipeable, and the plant Wi-Fi runs WPA3. BYOD without the risk."},
  29:{"id":"m29","title":"Who Gets In","track":"sec","domain":"4 Operations","brief":"Different systems need different access rules: classified plant docs, a shared team folder, and an app that should check department, device, and time of day.","steps":[["Access to classified docs is set by clearance labels that admins control and users can't change. That's:",["MAC (mandatory access control)","DAC","RBAC","ABAC"],0,"Labels and clearances set by admins is mandatory access control."],["The app that decides by department, device, location, and time uses:",["ABAC (attribute-based)","MAC","DAC","Rule-based on IP only"],0,"Multiple attributes deciding access is ABAC."],["An app needs limited access to a user's calendar without ever seeing their password. Use:",["OAuth","LDAP","RADIUS","NTLM"],0,"OAuth grants scoped, delegated access with a token, not the password."],["Admin credentials should be checked out from a vault and rotated after use. That's:",["Privileged access management (PAM)","SSO","Federation","DAC"],0,"PAM vaults and rotates privileged credentials."]],"debrief":"Each system now uses the right access model, apps use OAuth instead of shared passwords, and admin creds live in a vault."},
  30:{"id":"m30","title":"The Contractor Who Never Left","track":"sec","domain":"4 Operations","brief":"During an audit you find a contractor whose contract ended four months ago still has an active VPN account, and it logged in last weekend.","steps":[["What process failed?",["Deprovisioning","Identity proofing","Federation","Tokenization"],0,"Access should be removed as soon as the relationship ends."],["What do you do right now?",["Disable the account, preserve the logs, and start IR on that login","Delete the logs to tidy up","Wait until next quarter's review","Reset the password and email it to the contractor"],0,"A login from an account that should be dead is a potential incident; contain and preserve."],["What recurring control would have caught this?",["Periodic access reviews / attestation","Full-disk encryption","WPA3","Code signing"],0,"Scheduled reviews make managers confirm who still needs access."],["Contractor accounts should expire automatically on the contract end date. That's:",["Least privilege with time-bound access","Non-repudiation","Defense in depth","Fail-open"],0,"Access limited to exactly the time and scope needed."]],"debrief":"It turned out the contractor reused a leaked password. You added expiration dates to all vendor accounts and quarterly reviews."},
