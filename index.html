<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SC-900 + Sec+ Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#CFE8F8;--surface:#FFFFFF;--sunk:#E3F1EE;--ink:#123B5B;--muted:#42677A;--line:#BED9D5;
  --sc:#2361A3;--sec:#198754;--gold:#198754;--violet:#2361A3;
  --ok:#1D7445;--bad:#B3261E;--okbg:#E2F1E8;--badbg:#F8E3E1;--scbg:#E3ECF6;--secbg:#E1F3E8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0A2942;--surface:#132B38;--sunk:#102C2D;--ink:#E4F2F1;--muted:#9AB9C1;--line:#294D53;
  --sc:#72A6E3;--sec:#5CC48A;--gold:#5CC48A;--violet:#72A6E3;
  --ok:#5CC48A;--bad:#F07C73;--okbg:#15301F;--badbg:#3A1C1A;--scbg:#15253A;--secbg:#15301F;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0A2942;--surface:#132B38;--sunk:#102C2D;--ink:#E4F2F1;--muted:#9AB9C1;--line:#294D53;
  --sc:#72A6E3;--sec:#5CC48A;--gold:#5CC48A;--violet:#72A6E3;
  --ok:#5CC48A;--bad:#F07C73;--okbg:#15301F;--badbg:#3A1C1A;--scbg:#15253A;--secbg:#15301F;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);margin:0;padding-inline:16px;padding-block:20px 60px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,52px);text-transform:uppercase}
h2{font-size:30px}
h3{font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.eyebrow{font:500 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sc);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}

/* header */
header{display:flex;flex-direction:column;gap:14px}
.head-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.exams{display:flex;flex-wrap:wrap;gap:10px}
.exam{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--line);min-width:150px}
.exam b{font:700 24px/1 var(--display)}
.exam.sc{border-left:4px solid var(--sc)} .exam.sec{border-left:4px solid var(--sec)}
.sync{font:12px var(--mono);color:var(--muted)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font:600 17px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.rank-badge{align-self:flex-start;background:var(--ink);color:var(--bg);border-radius:999px;padding:5px 10px;font:500 12px var(--mono);letter-spacing:.04em}

/* strip */
.strip{display:grid;grid-template-columns:repeat(33,minmax(0,1fr));gap:3px}
@media (max-width:720px){.strip{grid-template-columns:repeat(11,minmax(0,1fr))}}
.cell{position:relative;height:40px;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--surface);border-radius:3px;font:600 13px var(--mono);color:var(--sec);padding:0;display:flex;align-items:center;justify-content:center}
.cell.sc{--c:var(--sc)} .cell.sec{--c:var(--sec)}
.cell.done{background:var(--c);color:var(--surface)}
.cell.exam::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell.review{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--sunk) 4px 6px)}
.cell.done.review{background-image:none}
.cell.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell.locked{opacity:1;cursor:not-allowed;background:var(--badbg);border-top-color:var(--bad);color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}

/* lesson */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px}
.lesson{display:flex;flex-direction:column;gap:18px}
.lesson .tag{display:inline-block;padding:2px 8px;border-radius:3px;font:600 12px var(--mono);letter-spacing:.04em}
.tag.sc{background:var(--scbg);color:var(--sc)} .tag.sec{background:var(--secbg);color:var(--sec)}
.pts{display:flex;flex-direction:column;gap:12px;max-width:68ch;margin:0;padding:0;list-style:none}
.pts li{padding-left:14px;border-left:2px solid var(--line)}
.pts b{display:block;font-weight:600}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:0}
.terms div{background:var(--sunk);border-radius:5px;padding:8px 10px}
.terms dt{font:500 13px var(--mono)}
.terms dd{margin:0;font-size:13px;color:var(--muted)}
.trap{background:var(--badbg);border-radius:6px;padding:12px 14px;max-width:68ch}
.trap .eyebrow{color:var(--bad)}
.diagrams{display:flex;flex-direction:column;gap:14px}
.diagrams figure{margin:0;display:flex;flex-direction:column;gap:6px}
.diagrams img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.diagrams figcaption{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.modebtn{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left}
.modebtn small{font-weight:400;color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select,input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink)}

/* quiz */
.launch{display:grid;gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.runner{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.timer.low i{background:var(--bad)}
.qtext{font-size:19px;font-weight:500;line-height:1.45;max-width:65ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 14px;font-size:15px}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-top:2px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.why{border-left:3px solid var(--ok);padding:6px 12px;background:var(--sunk);border-radius:0 6px 6px 0}
.why.bad{border-left-color:var(--bad)}
textarea{width:100%;min-height:110px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical}
.grade{display:flex;flex-wrap:wrap;gap:8px}
.grade button.sugg{outline:2px solid var(--violet)}
.aifb{font-size:14px;border-left:3px solid var(--violet);padding:6px 12px;background:var(--sunk);border-radius:0 6px 6px 0}
.streak{font:600 13px var(--mono);color:var(--gold)}

.result-top{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.big{font:700 64px/0.9 var(--display)}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.misslist{display:flex;flex-direction:column;gap:10px}
.miss{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.miss .ans{font-size:14px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tile b{font:700 32px/1 var(--display)}
.chartbox{overflow-x:auto}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--sunk);border-radius:6px;position:relative;overflow:hidden}
.bar .track i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.bar .track::after{content:"";position:absolute;left:80%;top:0;bottom:0;border-left:1px dashed var(--muted)}
.chip{display:inline-block;font:500 11px var(--mono);padding:1px 6px;border-radius:3px}
.chip.weak{background:var(--badbg);color:var(--bad)} .chip.good{background:var(--okbg);color:var(--ok)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-variant-numeric:tabular-nums;text-align:right} th.num{text-align:right}
.mode-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.insight{white-space:pre-wrap;font-size:14px;line-height:1.6;max-width:70ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.game-card{border:1px solid var(--line);border-radius:7px;padding:14px;background:var(--surface)}
.game-card b{display:block;font:700 26px/1 var(--display);margin-bottom:5px}
.mission{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mission:last-child{border-bottom:0}.mission i{font-style:normal;color:var(--gold)}
.boss{border-left:4px solid var(--sec)}.boss.sc{border-left-color:var(--sc)}
.shake{animation:shake .35s linear}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pbq-list{display:flex;flex-direction:column;gap:9px}
.drag-item,.drop-slot{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:14px}
.drag-item{cursor:grab}.drop-slot{min-height:42px;background:var(--sunk)}
.drag-item:active{cursor:grabbing}.logline{width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);padding:7px 9px;font:12px var(--mono)}
.logline.flagged{border-color:var(--bad);background:var(--badbg)}
.story{border-left:4px solid var(--violet);padding:12px 14px;background:var(--sunk);border-radius:0 6px 6px 0;max-width:70ch}
@media (max-width:720px){nav.tabs{overflow-x:auto}nav.tabs button{flex:0 0 auto}}
@media (max-width:720px){.cols{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 60px}}
footer{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <div class="eyebrow">RJ · 33-day plan · two exams</div>
        <h1>SC-900 + Sec+ Sprint</h1>
        <span class="rank-badge" id="rank"></span>
      </div>
      <div class="exams" id="exams"></div>
    </div>
    <div class="row" style="justify-content:space-between">
      <label class="fld">Plan start date<input type="date" id="start"></label>
      <span class="sync" id="sync">Loading saved progress…</span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="plan" aria-selected="true">Plan</button>
      <button role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
      <button role="tab" data-tab="stats" aria-selected="false">Stats</button>
      <button role="tab" data-tab="game" aria-selected="false">Game</button>
      <button role="tab" data-tab="pbq" aria-selected="false">PBQs</button>
      <button role="tab" data-tab="campaign" aria-selected="false">Campaign</button>
    </nav>
  </header>
  <main id="view"></main>
  <footer>
    <div>Study pairing: <a href="https://learn.microsoft.com/en-us/training/courses/sc-900t00" target="_blank" rel="noopener">Microsoft Learn SC-900 course</a> · <a href="https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/sc-900" target="_blank" rel="noopener">SC-900 skills measured</a> · <a href="https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/" target="_blank" rel="noopener">Professor Messer SY0-701 (free videos)</a> · <a href="https://www.comptia.org/certifications/security" target="_blank" rel="noopener">CompTIA Security+</a></div>
    <div>Keyboard in quizzes: 1–4 pick an answer, Enter goes to the next question.</div>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function(){
const DAYS = window.DAYS;
const BYDAY = Object.fromEntries(DAYS.map(d=>[d.d,d]));
const TRACK = {sc:"SC-900", sec:"Security+"};
const DOMS = {sc:["Concepts","Entra","Security solutions","Compliance"], sec:["1 General concepts","2 Threats & vulns","3 Architecture","4 Operations","5 Program mgmt"]};
const MODES = {think:{name:"Think",color:"var(--ink)",desc:"Untimed. See why after each answer."},
               blitz:{name:"Blitz",color:"var(--gold)",desc:"20 seconds each. Explanations at the end."},
               written:{name:"Written",color:"var(--violet)",desc:"No choices. Answer from memory, then grade."}};
const BLITZ_MS = 20000;

// ---------- question index ----------
const Q = {};
DAYS.forEach(day=>{ (day.q||[]).forEach((x,i)=>{ Q[day.d+"-"+i] = {k:day.d+"-"+i, d:day.d, track:day.track, dom:day.dom, q:x[0], o:x[1], a:x[2], why:x[3]}; }); });
const keysFor = days => Object.values(Q).filter(x=>days.includes(x.d)).map(x=>x.k);
const allTrackDays = t => DAYS.filter(d=>d.track===t && d.q).map(d=>d.d);
const RANKS=[["Recruit",0],["Specialist",250],["Sergeant",600],["Lieutenant",1100],["Captain",1800],["Cyber All-Star",2800]];
const ACHIEVEMENTS={clean:{name:"Clean Sweep",desc:"Score 100% on a 10+ question run"},night:{name:"Night Shift",desc:"Finish a quiz after midnight"},crypto:{name:"Crypto Sniper",desc:"Get five cryptography questions right"}};

// ---------- helpers ----------
function h(t,a,...c){const e=document.createElement(t);for(const[k,v]of Object.entries(a||{})){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}for(const x of c.flat(9)){if(x==null||x===false)continue;e.append(x.nodeType?x:document.createTextNode(String(x)));}return e;}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pct=(a,b)=>b?Math.round(100*a/b):0;
const fmtD=d=>d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const fmtDT=ts=>new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
const secs=ms=>(ms/1000).toFixed(1)+"s";
function parseDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function dayDate(n){const s=parseDate(state.start);s.setDate(s.getDate()+n-1);return s;}
function todayN(){return Math.floor((midnight(new Date())-parseDate(state.start))/864e5)+1;}
function unlockedDay(){const next=DAYS.find(d=>!state.done[d.d]);return next?next.d:33;}

// ---------- state + storage ----------
const LS="sprint.v2";
let state={start:"2026-09-24",done:{},xp:0,achievements:{},bosses:{},customQuestions:[],campaign:0};
let attempts=[];
let db=null, sample=null;
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null");}catch(e){return null;}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify({state,attempts:db?[]:attempts}));}catch(e){}}
const saved=lsGet(); if(saved){ if(saved.state) state=Object.assign(state,saved.state); if(!db && saved.attempts) attempts=saved.attempts; }
state.done=state.done||{}; state.achievements=state.achievements||{}; state.bosses=state.bosses||{}; state.customQuestions=state.customQuestions||[]; state.campaign=typeof state.campaign==="object"?state.campaign:{step:0,score:0};
state.customQuestions.forEach(addCustomQuestion);
let ui={tab:"plan",sel:null,quiz:{scope:"today",mode:"think",n:10},pbq:"firewall",generated:[]};
try{const u=JSON.parse(localStorage.getItem(LS+".ui")||"null"); if(u){ui.tab=u.tab||ui.tab; Object.assign(ui.quiz,u.quiz||{});}}catch(e){}
function saveUI(){try{localStorage.setItem(LS+".ui",JSON.stringify({tab:ui.tab,quiz:ui.quiz}));}catch(e){}}

let progWriting=Promise.resolve();
function saveProgress(){
  lsSet();
  if(db){ const body={start:state.start,done:state.done}; progWriting=progWriting.then(()=>db.doc("meta/progress").set(body)).catch(()=>{}); }
}
async function saveAttempt(rec){
  if(db){
    try{ await db.collection("attempts").add(rec); return; }
    catch(e){ if(e&&e.code==="quota_exceeded"){ setSync("Storage full: delete old attempts to save new ones"); } }
  }
  attempts.push(rec); attempts.sort((a,b)=>a.ts-b.ts); lsSet(); render();
}
function setSync(t){document.getElementById("sync").textContent=t;}
setSync("Saved in this browser only");

function addCustomQuestion(q){
  if(!q||!q.k||!Array.isArray(q.o)||q.o.length!==4||!Number.isInteger(q.a)) return;
  Q[q.k]=q;
}
function rank(){
  return RANKS.slice().reverse().find(([,need])=>state.xp>=need)||RANKS[0];
}
function award(name){
  if(state.achievements[name]) return;
  state.achievements[name]=Date.now();
  saveProgress();
}
function recordGameProgress(rec){
  const correct=rec.items.reduce((n,[,ok])=>n+(ok===1?1:0),0);
  const bonus=rec.mode==="blitz"?correct*5:rec.mode==="written"?correct*8:0;
  state.xp+=(correct*10)+bonus;
  if(rec.n>=10&&rec.pct===100) award("clean");
  if(new Date(rec.ts).getHours()<5) award("night");
  const crypto=rec.items.filter(([k,ok])=>ok===1&&/crypt|public key|private key|hash/i.test(Q[k]&&Q[k].q)).length;
  if(crypto>=5) award("crypto");
  saveProgress();
}
function missionData(){
  const today=midnight(new Date()).getTime();
  const todayItems=attempts.filter(a=>midnight(new Date(a.ts)).getTime()===today).flatMap(a=>a.items||[]);
  const correct=todayItems.filter(([,ok])=>ok===1).length;
  const blitz=attempts.filter(a=>midnight(new Date(a.ts)).getTime()===today&&a.mode==="blitz").flatMap(a=>a.items||[]);
  const fast=blitz.filter(([,ok,ms])=>ok===1&&ms<8000).length;
  const outcomes={};
  attempts.forEach(a=>(a.items||[]).forEach(([k,ok])=>{const r=outcomes[k]||(outcomes[k]=[]);r.push(ok);}));
  const cleared=Object.values(outcomes).filter(r=>r.includes(0)&&r[r.length-1]===1).length;
  return [
    {text:"Answer 5 questions today",now:todayItems.length,goal:5},
    {text:"Get 3 correct in Blitz under 8 seconds",now:fast,goal:3},
    {text:"Clear 5 weak spots",now:cleared,goal:5}
  ];
}

// connect capabilities
if(window.claude && typeof window.claude.use==="function"){
  window.claude.use("db").then(d=>{
    if(!d) return;
    db=d; setSync("Synced to your account");
    const local=attempts.slice();
    let first=true;
    db.collection("attempts").orderBy("ts","asc").limit(1000).onSnapshot(snap=>{
      attempts=snap.docs.map(x=>x.data());
      if(first){ first=false;

  const prompt="You're a blunt, encouraging study coach for RJ, a military veteran preparing for Microsoft SC-900 (exam on day 12 of his plan) and CompTIA Security+ SY0-701 (exam on day 33). Today is day "+t+" of 33. Practice target is 80%.\n\nAccuracy by domain:\n"+dom+"\n\nBy mode:\n"+modes+"\n\nRecent tests:\n"+log+"\n\nMost-missed questions:\n"+top+"\n\nWrite a short plan in plain text, no markdown headers or bold: 1) one sentence on where he stands for the next exam, 2) the 2–3 weakest concepts and a one-line plain-English explanation of each, 3) exactly what to run in this quiz app today (scope + mode). Under 180 words.";
  try{ await sample(prompt,{cache:false,onText:({text})=>{insight.text=text;const el=document.getElementById("insout");if(el)el.textContent=text;}}); }
  catch(e){ insight.text=(e&&e.text)||(e&&e.code==="rate_limited"?"Too many requests right now. Try again in a bit.":e&&e.code==="not_granted"?"Coaching is off for this page.":"Couldn't reach Claude. Try again."); if(e&&["not_granted","sampling_disabled","not_declared"].includes(e.code)) sample=null; }
  insight.busy=false; render();
}

// ---------- render ----------
function softRender(){ if(run&&!run.finished&&ui.tab==="quiz"){ renderHeader(); return; } render(); }
function render(){
  renderHeader();
  const v=document.getElementById("view");
  v.replaceChildren(ui.tab==="plan"?renderPlan():ui.tab==="quiz"?renderQuizTab():ui.tab==="stats"?renderStats():ui.tab==="game"?renderGame():ui.tab==="pbq"?renderPBQ():renderCampaign());
  if(run&&!run.finished&&run.mode==="blitz"&&!run.answered&&!tick) startTimer();
}
if(location.hash==="#quiz"||location.hash==="#stats"||location.hash==="#plan") ui.tab=location.hash.slice(1);
render();
})();
</script>
