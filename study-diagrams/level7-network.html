<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=1700"><style>
body{margin:0;background:#0d1117;font-family:system-ui,Segoe UI,Arial,sans-serif}
</style></head><body><a class="backlink" href="./" style="color:#8b949e;font:14px system-ui,sans-serif;text-decoration:none;display:inline-block;margin-bottom:10px">← All study diagrams</a>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,Segoe UI,Arial,sans-serif">
<defs>
 <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ff6b5b"/></marker>
 <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#b48cff"/></marker>
 <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#4cc38a"/></marker>
</defs>
<text x="40" y="52" fill="#e6edf3" font-size="30" font-weight="700">Level 7: one request, all the way in</text>
<text x="40" y="84" fill="#8b949e" font-size="17">Red = a customer's web request · Purple = an admin managing the database server · Green = what the NSG allows</text>

<!-- Defender for Cloud umbrella -->
<rect x="450" y="120" width="1120" height="720" rx="18" fill="none" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="10 7"/>
<text x="470" y="150" fill="#e3b341" font-size="18" font-weight="700">Microsoft Defender for Cloud watches everything inside Azure</text>
<text x="470" y="172" fill="#c9a33a" font-size="15">posture management + secure score (free) · workload protection alerts (paid Defender plans)</text>

<!-- user -->
<rect x="40" y="420" width="120" height="85" rx="8" fill="none" stroke="#ff6b5b" stroke-width="3"/><text x="100" y="470" fill="#ff6b5b" font-size="17" text-anchor="middle">Customer</text>
<!-- internet -->
<ellipse cx="300" cy="462" rx="95" ry="58" fill="none" stroke="#ff6b5b" stroke-width="3"/><text x="300" y="468" fill="#ff6b5b" font-size="18" text-anchor="middle">Internet</text>
<!-- DDoS -->
<rect x="470" y="380" width="80" height="170" rx="8" fill="#1f2a1f" stroke="#ff6b5b" stroke-width="2"/>
<text x="510" y="430" fill="#ffb4a8" font-size="15" text-anchor="middle" font-weight="700">DDoS</text>
<text x="510" y="450" fill="#ffb4a8" font-size="13" text-anchor="middle">Protection</text>
<text x="510" y="480" fill="#8b949e" font-size="12" text-anchor="middle">absorbs</text><text x="510" y="495" fill="#8b949e" font-size="12" text-anchor="middle">floods</text>
<text x="510" y="575" fill="#7ee787" font-size="13" text-anchor="middle" font-weight="700">ADDED</text>

<!-- Firewall -->
<rect x="590" y="400" width="170" height="125" rx="8" fill="none" stroke="#ff6b5b" stroke-width="3"/>
<text x="675" y="450" fill="#ff6b5b" font-size="20" text-anchor="middle" font-weight="700">Azure</text><text x="675" y="474" fill="#ff6b5b" font-size="20" text-anchor="middle" font-weight="700">Firewall</text>
<text x="675" y="500" fill="#8b949e" font-size="12" text-anchor="middle">one central rulebook:</text><text x="675" y="514" fill="#8b949e" font-size="12" text-anchor="middle">IPs, ports, domains</text>
<!-- WAF -->
<rect x="800" y="400" width="120" height="125" rx="8" fill="none" stroke="#ff6b5b" stroke-width="3"/>
<text x="860" y="455" fill="#ff6b5b" font-size="22" text-anchor="middle" font-weight="700">WAF</text>
<text x="860" y="480" fill="#8b949e" font-size="12" text-anchor="middle">reads web</text><text x="860" y="494" fill="#8b949e" font-size="12" text-anchor="middle">requests; blocks</text><text x="860" y="508" fill="#8b949e" font-size="12" text-anchor="middle">SQLi and XSS</text>

<!-- Web VNet -->
<rect x="960" y="300" width="250" height="355" rx="14" fill="none" stroke="#4cc38a" stroke-width="3"/>
<text x="1085" y="330" fill="#4cc38a" font-size="18" text-anchor="middle" font-weight="700">VNet A (web)</text>
<rect x="1020" y="400" width="130" height="125" rx="8" fill="none" stroke="#ff6b5b" stroke-width="3"/>
<text x="1085" y="455" fill="#ff6b5b" font-size="19" text-anchor="middle" font-weight="700">Web</text><text x="1085" y="478" fill="#ff6b5b" font-size="19" text-anchor="middle" font-weight="700">server</text>

<!-- Key Vault -->
<rect x="1010" y="575" width="150" height="62" rx="8" fill="#211c2e" stroke="#e3b341" stroke-width="2"/>
<text x="1085" y="602" fill="#e3b341" font-size="16" text-anchor="middle" font-weight="700">Key Vault</text>
<text x="1085" y="622" fill="#8b949e" font-size="12" text-anchor="middle">DB password lives here</text>
<line x1="1085" y1="575" x2="1085" y2="527" stroke="#e3b341" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1085" y="680" fill="#7ee787" font-size="13" font-weight="700" text-anchor="middle">ADDED</text>

<!-- DB VNet -->
<rect x="1300" y="300" width="240" height="360" rx="14" fill="none" stroke="#4cc38a" stroke-width="3"/>
<text x="1312" y="330" fill="#4cc38a" font-size="17" font-weight="700">VNet B (DB)</text>
<rect x="1355" y="400" width="130" height="125" rx="8" fill="none" stroke="#ff6b5b" stroke-width="3"/>
<text x="1420" y="455" fill="#ff6b5b" font-size="19" text-anchor="middle" font-weight="700">DB VM</text>
<text x="1420" y="478" fill="#8b949e" font-size="13" text-anchor="middle">private IP only</text>
<!-- NSG -->
<rect x="1318" y="545" width="204" height="90" rx="8" fill="#14261c" stroke="#4cc38a" stroke-width="2"/>
<text x="1420" y="570" fill="#4cc38a" font-size="16" text-anchor="middle" font-weight="700">NSG on DB subnet</text>
<text x="1420" y="591" fill="#c9d1d9" font-size="12" text-anchor="middle">ALLOW web server → port 1433</text>
<text x="1420" y="608" fill="#c9d1d9" font-size="12" text-anchor="middle">ALLOW Bastion → RDP/SSH</text>
<text x="1420" y="625" fill="#c9d1d9" font-size="12" text-anchor="middle">DENY everything else</text>

<!-- peering -->
<line x1="1210" y1="380" x2="1300" y2="380" stroke="#4cc38a" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1255" y="370" fill="#4cc38a" font-size="14" text-anchor="middle" font-weight="700">peering</text>
<text x="1255" y="400" fill="#7ee787" font-size="12" text-anchor="middle" font-weight="700">ADDED</text>

<!-- red path -->
<path d="M160,462 L205,462" stroke="#ff6b5b" stroke-width="3" marker-end="url(#r)"/>
<path d="M395,462 L468,462" stroke="#ff6b5b" stroke-width="3" marker-end="url(#r)"/>
<path d="M550,462 L588,462" stroke="#ff6b5b" stroke-width="3" marker-end="url(#r)"/>
<path d="M760,462 L798,462" stroke="#ff6b5b" stroke-width="3" marker-end="url(#r)"/>
<path d="M920,462 L1018,462" stroke="#ff6b5b" stroke-width="3" marker-end="url(#r)"/>
<path d="M1150,462 L1353,462" stroke="#ff6b5b" stroke-width="3" marker-end="url(#r)"/>
<text x="1250" y="452" fill="#ff6b5b" font-size="13" text-anchor="middle">SQL query</text>

<!-- purple admin path -->
<rect x="40" y="215" width="120" height="70" rx="8" fill="none" stroke="#b48cff" stroke-width="3"/><text x="100" y="257" fill="#b48cff" font-size="17" text-anchor="middle">Admin</text>
<path d="M160,250 L640,250" stroke="#b48cff" stroke-width="3" marker-end="url(#p)"/>
<text x="300" y="232" fill="#b48cff" font-size="16" text-anchor="middle" font-weight="700">HTTPS (443) via the</text><text x="300" y="232" dy="0" fill="none"> </text><text x="300" y="252" fill="none"> </text><text x="300" y="214" fill="#b48cff" font-size="16" text-anchor="middle" font-weight="700"></text>
<text x="300" y="275" fill="#b48cff" font-size="16" text-anchor="middle" font-weight="700">Azure portal</text><text x="300" y="300" fill="#8b949e" font-size="13" text-anchor="middle">RDP/SSH never crosses the internet</text>
<rect x="645" y="205" width="190" height="90" rx="8" fill="#211c2e" stroke="#b48cff" stroke-width="3"/>
<text x="740" y="245" fill="#b48cff" font-size="20" text-anchor="middle" font-weight="700">Azure Bastion</text>
<text x="740" y="270" fill="#8b949e" font-size="12" text-anchor="middle">lives inside Azure</text>
<path d="M835,250 L1470,250 L1470,398" fill="none" stroke="#b48cff" stroke-width="3" marker-end="url(#p)"/>
<text x="1110" y="238" fill="#b48cff" font-size="16" text-anchor="middle" font-weight="700">RDP / SSH to the VM's private IP</text>

<!-- outbound -->
<path d="M675,525 L675,690" stroke="#ff6b5b" stroke-width="3" marker-end="url(#r)"/>
<text x="675" y="715" fill="#ff6b5b" font-size="15" text-anchor="middle">Outbound traffic (e.g. sending mail)</text>
<text x="675" y="735" fill="#8b949e" font-size="13" text-anchor="middle">filtered by Azure Firewall rules</text>
<text x="675" y="755" fill="#8b949e" font-size="13" text-anchor="middle">Phishing/email threats = Defender for Office 365 (Level 8)</text>
</svg></body></html>
